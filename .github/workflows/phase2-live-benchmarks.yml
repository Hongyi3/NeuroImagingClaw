name: phase2-live-benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/phase2-live-benchmarks.yml"
      - "benchmarks/**"
      - "!benchmarks/artifacts/phase2_ds003020_mriqc/**"
      - "!benchmarks/artifacts/phase2_ds003020_anat_bold_prep/**"
      - "!benchmarks/artifacts/phase2_failure_debug/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: write

jobs:
  phase2-live-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install repository and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' awscli

      - name: Verify Docker runtime
        run: |
          docker --version
          docker info

      - name: Download pinned ds003020 subset
        env:
          DATASET_ROOT: /tmp/clawneuro-phase2-ds003020
        run: |
          rm -rf "$DATASET_ROOT"
          aws s3 sync --no-sign-request s3://openneuro.org/ds003020 "$DATASET_ROOT" \
            --exclude "*" \
            --include "dataset_description.json" \
            --include "participants.tsv" \
            --include "sub-UTS01/ses-1/anat/sub-UTS01_ses-1_T1w.nii.gz" \
            --include "sub-UTS01/ses-1/func/sub-UTS01_ses-1_task-CategoryLocalizer1_run-1_bold.json" \
            --include "sub-UTS01/ses-1/func/sub-UTS01_ses-1_task-CategoryLocalizer1_run-1_bold.nii.gz"
          python - <<'PY'
          import json
          from pathlib import Path

          dataset_root = Path("/tmp/clawneuro-phase2-ds003020")
          required = [
              Path("dataset_description.json"),
              Path("participants.tsv"),
              Path("sub-UTS01/ses-1/anat/sub-UTS01_ses-1_T1w.nii.gz"),
              Path("sub-UTS01/ses-1/func/sub-UTS01_ses-1_task-CategoryLocalizer1_run-1_bold.json"),
              Path("sub-UTS01/ses-1/func/sub-UTS01_ses-1_task-CategoryLocalizer1_run-1_bold.nii.gz"),
          ]
          missing = [str(path) for path in required if not (dataset_root / path).exists()]
          if missing:
              raise SystemExit(f"Missing benchmark inputs: {missing}")
          dataset_description = json.loads((dataset_root / "dataset_description.json").read_text(encoding="utf-8"))
          doi = dataset_description.get("DatasetDOI")
          if doi != "doi:10.18112/openneuro.ds003020.v3.1.0":
              raise SystemExit(f"Unexpected DatasetDOI: {doi!r}")
          print(json.dumps({"dataset_root": str(dataset_root), "dataset_doi": doi}, indent=2))
          PY

      - name: Pull pinned containers
        run: |
          docker pull nipreps/mriqc:24.0.0
          docker pull nipreps/fmriprep:23.1.2

      - name: Run MRIQC Phase 2 benchmark command
        run: |
          set +e
          python benchmarks/run_phase2_public_mriqc.py \
            --dataset-root /tmp/clawneuro-phase2-ds003020 \
            --workspace /tmp/clawneuro-m5-work/mriqc \
            --artifact-root benchmarks/artifacts/phase2_ds003020_mriqc \
            --backend docker 2>&1 | tee /tmp/mriqc-step.log
          command_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$command_status" > /tmp/mriqc-step-status.txt

      - name: Check MRIQC Phase 2 benchmark result
        run: |
          command_status=$(cat /tmp/mriqc-step-status.txt)
          if [ "$command_status" -ne 0 ]; then
            python - <<'PY'
            from pathlib import Path

            text = Path("/tmp/mriqc-step.log").read_text(encoding="utf-8", errors="replace")
            message = "\n".join(text.splitlines()[-80:])
            message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print(f"::error title=MRIQC benchmark failed::{message}")
            PY
            echo "MRIQC benchmark workspace contents:"
            find /tmp/clawneuro-m5-work/mriqc -maxdepth 4 -type f | sort || true
            exit "$command_status"
          fi

      - name: Run anat/BOLD preprocessing Phase 2 benchmark command
        run: |
          set +e
          python benchmarks/run_phase2_public_anat_bold_prep.py \
            --dataset-root /tmp/clawneuro-phase2-ds003020 \
            --workspace /tmp/clawneuro-m5-work/prep \
            --artifact-root benchmarks/artifacts/phase2_ds003020_anat_bold_prep \
            --backend docker 2>&1 | tee /tmp/prep-step.log
          command_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$command_status" > /tmp/prep-step-status.txt

      - name: Check anat/BOLD preprocessing Phase 2 benchmark result
        run: |
          command_status=$(cat /tmp/prep-step-status.txt)
          if [ "$command_status" -ne 0 ]; then
            python - <<'PY'
            from pathlib import Path

            text = Path("/tmp/prep-step.log").read_text(encoding="utf-8", errors="replace")
            message = "\n".join(text.splitlines()[-80:])
            message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print(f"::error title=Preprocessing benchmark failed::{message}")
            PY
            echo "Preprocessing benchmark workspace contents:"
            find /tmp/clawneuro-m5-work/prep -maxdepth 4 -type f | sort || true
            exit "$command_status"
          fi

      - name: Verify repository after benchmark execution
        run: |
          python -m pytest
          ruff check src tests benchmarks

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-live-benchmark-artifacts
          path: |
            benchmarks/artifacts/phase2_ds003020_mriqc
            benchmarks/artifacts/phase2_ds003020_anat_bold_prep
            /tmp/clawneuro-m5-work
            /tmp/clawneuro-phase2-ds003020

      - name: Persist benchmark failure logs
        if: failure()
        env:
          DEBUG_ROOT: benchmarks/artifacts/phase2_failure_debug
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          debug_root = Path(os.environ["DEBUG_ROOT"])
          if debug_root.exists():
              shutil.rmtree(debug_root)
          debug_root.mkdir(parents=True, exist_ok=True)

          for step_log in (Path("/tmp/mriqc-step.log"), Path("/tmp/prep-step.log")):
              if step_log.exists():
                  destination = debug_root / step_log.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(step_log, destination)

          workspace_root = Path("/tmp/clawneuro-m5-work")
          workspace_debug_root = debug_root / "workspace"
          if workspace_root.exists():
              for path in workspace_root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix not in {".json", ".log", ".md", ".txt", ".html"}:
                      continue
                  destination = workspace_debug_root / path.relative_to(workspace_root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)

          dataset_root = Path("/tmp/clawneuro-phase2-ds003020")
          if dataset_root.exists():
              for relative in (Path("dataset_description.json"), Path("participants.tsv")):
                  source = dataset_root / relative
                  if source.exists():
                      destination = debug_root / "dataset" / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source, destination)

          metadata = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref_name": os.environ.get("GITHUB_REF_NAME"),
          }
          (debug_root / "failure-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          if [ -z "$(git status --short -- "$DEBUG_ROOT")" ]; then
            echo "No benchmark failure logs to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEBUG_ROOT"
          git commit -m "ci: capture phase2 benchmark failure logs"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Commit generated live benchmark artifacts
        if: success()
        run: |
          if [ -z "$(git status --short -- benchmarks/artifacts/phase2_ds003020_mriqc benchmarks/artifacts/phase2_ds003020_anat_bold_prep)" ]; then
            echo "No benchmark artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/artifacts/phase2_ds003020_mriqc benchmarks/artifacts/phase2_ds003020_anat_bold_prep
          git commit -m "benchmarks: add phase2 ds003020 live artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
