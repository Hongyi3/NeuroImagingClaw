name: docs-check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository basics
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f llms.txt
          test -f docs/PROJECT-CHARTER.md
          test -f skills/catalog.json
