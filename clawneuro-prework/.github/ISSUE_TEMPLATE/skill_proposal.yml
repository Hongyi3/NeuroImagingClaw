name: Skill proposal
description: Propose a new ClawNeuro skill
title: "[skill] "
labels: ["skill-proposal"]
body:
  - type: input
    id: skill_name
    attributes:
      label: Proposed skill name
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Scientific purpose
      description: One scientific job this skill should do
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Relevant standards and validators
      description: NWB, BIDS, NeuroML, validators, archives, etc.
  - type: textarea
    id: backends
    attributes:
      label: Proposed backend libraries
  - type: textarea
    id: benchmarks
    attributes:
      label: Benchmark idea
      description: Public or synthetic benchmark path
    validations:
      required: true
