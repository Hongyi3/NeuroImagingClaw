name: Bug report
description: Report a reproducible bug in code, docs, or benchmark behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, files, and environment needed to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark impact
      description: Does this affect a benchmark or release claim?
